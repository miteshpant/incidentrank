services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentrank
      POSTGRES_PASSWORD: incidentrank
      POSTGRES_DB: incidentrank
    ports:
      - "5433:5432"
    volumes:
      - incidentrank-postgres-data:/var/lib/postgresql/data

volumes:
  incidentrank-postgres-data:
